logLevel: info
logDestinations: [stdout]

rtsp: true
rtspAddress: :8554
rtspTransports: [udp, tcp]
rtpAddress: :8000
rtcpAddress: :8001
rtspEncryption: "no"
rtmp: false
hls: false
webrtc: false
srt: false
moq: false
api: false
metrics: false
pprof: false
playback: false

authMethod: internal
authInternalUsers:
  - user: any
    ips: [127.0.0.1, "::1"]
    permissions:
      - action: publish
        path: camera
  # Anonymous viewing is intended only for an isolated, trusted camera LAN.
  - user: any
    ips: []
    permissions:
      - action: read
        path: camera

paths:
  camera:
    source: publisher
    overridePublisher: false
